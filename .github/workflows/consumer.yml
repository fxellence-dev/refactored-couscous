name: Consumer CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'consumer/**'
      - 'scripts/**'
      - '.github/workflows/consumer.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'consumer/**'

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL || 'http://localhost:9292' }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME || 'pact' }}
  PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD || 'pact' }}
  CONSUMER_NAME: payment-client
  GIT_COMMIT: ${{ github.sha }}
  GIT_BRANCH: ${{ github.ref_name }}

jobs:
  test:
    name: Test Consumer
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: consumer/package-lock.json

      - name: Install dependencies
        working-directory: ./consumer
        run: npm ci

      - name: Run consumer tests
        working-directory: ./consumer
        run: npm test

      - name: Upload Pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: consumer/pacts/*.json
          retention-days: 7

  publish:
    name: Publish Consumer Contract
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: consumer/pacts

      - name: Publish contracts to broker
        run: |
          node scripts/publish-consumer-contract.js \
            --version ${{ github.sha }}

      - name: Comment on PR with contract
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Consumer Contract Published**\n\nVersion: `${{ github.sha }}`\nBranch: `${{ github.ref_name }}`\n\nView contract in [Pact Broker](${{ env.PACT_BROKER_BASE_URL }}/pacts/provider/payment-gateway-api/consumer/payment-client/latest)'
            })

  can-i-deploy:
    name: Can I Deploy Consumer
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check deployment safety
        id: can-i-deploy
        run: |
          node scripts/can-i-deploy-consumer.js \
            --version ${{ github.sha }} \
            --to production

      - name: Comment on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Consumer Can-I-Deploy Check Failed**\n\nThe consumer cannot be safely deployed as the provider has not verified compatibility.\n\nPlease review the verification results in the [Pact Broker](${{ env.PACT_BROKER_BASE_URL }}).'
            })

  deploy:
    name: Deploy Consumer
    runs-on: ubuntu-latest
    needs: can-i-deploy
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./consumer
        run: npm ci

      - name: Build consumer
        working-directory: ./consumer
        run: |
          echo "📦 Building consumer application..."
          echo "This would typically build your application"
          echo "Examples:"
          echo "  - npm run build"
          echo "  - docker build -t consumer:${{ github.sha }}"
          echo "✅ Build successful!"

      - name: Deploy to production
        run: |
          echo "🚀 Deploying consumer to production..."
          echo "This would typically deploy to your cloud provider"
          echo "Examples:"
          echo "  - AWS: aws lambda update-function-code"
          echo "  - Azure: az functionapp deployment"
          echo "  - Vercel: vercel deploy --prod"
          echo "✅ Deployment successful!"

      - name: Record deployment
        run: |
          node scripts/record-deployment.js \
            payment-client \
            ${{ github.sha }} \
            production

      - name: Notify success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('✅ Consumer deployed successfully to production');
            console.log('Version: ${{ github.sha }}');
            console.log('Branch: ${{ github.ref_name }}');

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('❌ Consumer deployment failed');
