version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: pact-broker-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pact_broker
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # Changed to 5434 to avoid conflict with local PostgreSQL
    networks:
      - pact-network

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pact-broker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: "postgresql://postgres:password@postgres/pact_broker"
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: "5"
      PACT_BROKER_PORT: "9292"
      # Basic auth credentials (change these!)
      PACT_BROKER_BASIC_AUTH_USERNAME: pact
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact
      PACT_BROKER_BASIC_AUTH_READ_ONLY_USERNAME: readonly
      PACT_BROKER_BASIC_AUTH_READ_ONLY_PASSWORD: readonly
      # Enable public badge access
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
      # Webhook configuration
      PACT_BROKER_WEBHOOK_HOST_WHITELIST: "host.docker.internal"
    ports:
      - "9292:9292"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9292/diagnostic/status/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pact-network

volumes:
  postgres-data:

networks:
  pact-network:
    driver: bridge
